# Ordinary pinned-toolchain proof CI. This is not the official hosted
# Comparator/registry protocol, and does not submit or accept any registry item.
name: Exact Lean source build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # verified v1 source
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Verify frozen standalone generation and source admissions
        run: |
          python3 scripts/generate_standalone.py --check
          python3 scripts/audit_sources.py
      - name: Normal serial and aggregate Lake builds
        run: python3 scripts/build_lake_serial.py
      - name: Compile renamed canonical Challenge without repository imports
        run: python3 scripts/check_canonical_challenge.py --compare-solution-dir .lake/build/lib/lean
      - name: Replay every shipped Lean source
        run: python3 scripts/build_sources.py
      - name: Print full target and complete axiom closures
        run: lake env lean -j1 -M6144 reports/AuditSolution.lean
