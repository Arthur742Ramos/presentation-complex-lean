version: "v0.4"
project:
  name: "Fundamental Groups of Arbitrary Presentation Complexes"
  description: >-
    Presentation-complex realization for ordinary topological fundamental groups.
    For every generator type S, independently universe-polymorphic relator-index
    type R, and family r : R → FreeGroup S, the genuine weak-topology endpoint
    quotient of one vertex and one interval per generator is constructed, with a
    circle attaching map for every relator from an actual finite word loop. The
    genuine quotient of that bouquet and the family of closed complex disks
    carries an ordinary Mathlib CW structure with one zero-cell, one one-cell
    per generator, one two-cell per relator index, and no higher cells. The
    actual quotient is Hausdorff and path connected, and its ordinary
    path-based fundamental group is equivalent to FreeGroup S ⧸
    Subgroup.normalClosure (Set.range r), with literal compatibility with the
    actual bouquet inclusion and each generator interval loop. A second theorem
    realizes every group as the fundamental group of a connected Hausdorff
    two-dimensional CW complex. No finiteness, countability, CW input, assumed
    generator identification, custom mathematical axiom, or admitted
    topological bridge appears.
  authors: ["Arthur Freitas Ramos", "David Barros Hulak", "Ruy Jose Guerra Barretto de Queiroz"]
  responsible_maintainers: ["Arthur Freitas Ramos", "David Barros Hulak", "Ruy Jose Guerra Barretto de Queiroz"]
  license: "Apache-2.0"
