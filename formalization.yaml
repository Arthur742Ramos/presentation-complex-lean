fidelity:
  divergences: >-
    Presentations are arbitrary with independent universes for generators and
    relator indices, strengthening any finite/countable reading of the source.
    Duplicate and identity relators retain their genuine indexed disk cells.
    Empty generators still give a vertex; empty relators give the bouquet.
    There are no added mathematical hypotheses. The square-to-complex-disk
    bridge uses Mathlib's proved convex-body homeomorphism.
